server:
  # 인증 기능이 없으므로 기본적으로 이 PC에서만 접속할 수 있게 localhost에만 바인딩한다.
  # 다른 기기에서 접속해야 하면 SERVER_ADDRESS=0.0.0.0 으로 실행한다.
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    # 키스토어 검증 실패 사유처럼 사용자가 고칠 수 있는 메시지를 프론트로 전달한다.
    include-message: always

spring:
  application:
    name: device-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devicehub}
    username: ${DB_USERNAME:devicehub}
    password: ${DB_PASSWORD:devicehub}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB

devicehub:
  adb:
    path: ${ADB_PATH:}
  storage:
    apk-path: ${APK_STORAGE_PATH:storage/apks}
    keystore-path: ${KEYSTORE_STORAGE_PATH:storage/keystores}
  security:
    # 키스토어 비밀번호 암호화용 마스터 키. 운영 환경에서는 반드시 KEYSTORE_SECRET_KEY를 설정한다.
    secret-key: ${KEYSTORE_SECRET_KEY:devicehub-local-dev-secret-key}
    # JWT 서명 키. 소스에 기본값을 두지 않는다. 미설정 시 기동할 때마다 무작위 키를 생성하고 prod 프로파일에서는 기동을 실패시킨다.
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    # 최초 관리자 계정. 두 값이 모두 설정되고 아직 ROLE_ADMIN이 없을 때만 생성한다.
    admin-username: ${DEVICEHUB_ADMIN_USERNAME:}
    admin-password: ${DEVICEHUB_ADMIN_PASSWORD:}
    admin-name: ${DEVICEHUB_ADMIN_NAME:관리자}
